updated: "6 November, 2025"

sections:
  - title: "Freelancing"
    content: |
      I recently quit my job as a systems quality engineer and an SDET at [Bitgrip](https://www.bitgrip.com/) to take the plunge into freelancing.
      Having worked in consulting and services for 10+ years now, this is a logical continuation.
      My focus is to help clients deliver high-quality software faster through continuous delivery.
      You can check out my professional site [here](https://anukrit.de).
  - title: "Beyond Quality"
    content: |
      Together with my friends [Vitaly](https://www.linkedin.com/in/vsharovatov/) and [Maryia](https://www.linkedin.com/in/maryia-tuleika/), I started a [collaborative research community](https://beyondquality.org) focused on advancing software quality practices through open discussion and shared knowledge.
      We host a [podcast](https://open.spotify.com/show/2JaVYJgv2aqFuV0HOQ8DXv) where we talk about the research in the community, and also invite guests to weigh in.
  - title: "LLMs under the hood"
    content: |
      In my free time, I am understanding LLMs by testing them and learning about their inner workings. I gave a [talk](https://youtu.be/U0St9rICQx4) recently at the Berlin Quality Engineering Meetup on my initial findings. I am enrolled in the awesome Trey Grainger's online course, [AI-Powered Search](https://maven.com/search-school/ai-powered-search). November is a packed month!
